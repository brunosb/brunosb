<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Bruno Silva Barbosa — software engineer</title>
  <desc id="desc">Animated dark technical hero with the words software, systems, and AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="0.52" stop-color="#0b1729"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/><stop offset="0.5" stop-color="#22c55e"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <style>
      .mono{font:500 14px 'SFMono-Regular',Consolas,monospace;letter-spacing:2px}
      .title{font:600 52px Inter,Arial,sans-serif;letter-spacing:-2px}
      .sub{font:400 20px Inter,Arial,sans-serif}
      .node{animation:pulse 3s ease-in-out infinite}
      .node:nth-child(2){animation-delay:.7s}.node:nth-child(3){animation-delay:1.4s}.node:nth-child(4){animation-delay:2.1s}
      .scan{animation:scan 5s linear infinite}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
      @keyframes scan{0%{transform:translateX(-240px);opacity:0}15%{opacity:.8}70%{opacity:.8}100%{transform:translateX(1240px);opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <circle cx="940" cy="40" r="180" fill="#22c55e" opacity=".12" filter="url(#blur)"/>
  <circle cx="1080" cy="300" r="150" fill="#38bdf8" opacity=".12" filter="url(#blur)"/>
  <g opacity=".18" stroke="#94a3b8" stroke-width="1">
    <path d="M0 280H1200M0 220H1200M0 160H1200M0 100H1200"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
  </g>
  <rect class="scan" x="0" y="0" width="2" height="360" fill="url(#glow)"/>
  <g fill="none" stroke="#38bdf8" stroke-opacity=".45" stroke-width="1.5">
    <path d="M820 82L960 132L1080 75L1140 172L1010 242L880 214L820 82Z"/>
    <path d="M820 82L880 214M960 132L1010 242M1080 75L960 132M1140 172L1010 242"/>
  </g>
  <g fill="#22c55e">
    <circle class="node" cx="820" cy="82" r="5"/><circle class="node" cx="960" cy="132" r="5"/><circle class="node" cx="1080" cy="75" r="5"/><circle class="node" cx="1140" cy="172" r="5"/>
  </g>
  <text x="72" y="72" class="mono" fill="#86efac">BRUNO SILVA BARBOSA / PROFILE README</text>
  <text x="72" y="154" class="title" fill="#f8fafc">Software that connects</text>
  <text x="72" y="216" class="title" fill="#f8fafc">systems, data &amp; reality.</text>
  <text x="75" y="272" class="sub" fill="#94a3b8">Software Engineer · DevOps · AI · RFID</text>
  <g class="mono" fill="#64748b"><text x="75" y="320">[ building reliable products ]</text><text x="390" y="320">[ automating operations ]</text><text x="688" y="320">[ shipping continuously ]</text></g>
</svg>
