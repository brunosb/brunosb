<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 210" role="img" aria-labelledby="title">
  <title id="title">Product architecture: field, applications, data, infrastructure and AI</title>
  <defs><style>
    .box{fill:#0f172a;stroke:#334155;stroke-width:1}.label{font:600 15px Inter,Arial,sans-serif;fill:#f8fafc}.small{font:400 12px Inter,Arial,sans-serif;fill:#94a3b8}.line{stroke:#22c55e;stroke-width:2;stroke-dasharray:7 8;animation:flow 4s linear infinite}@keyframes flow{to{stroke-dashoffset:-60}}
  </style></defs>
  <rect width="1100" height="210" rx="16" fill="#07111f"/>
  <g class="line" fill="none"><path d="M180 105H265M420 105H505M660 105H745M900 105H990"/></g>
  <g><rect class="box" x="35" y="60" width="145" height="90" rx="12"/><text class="label" x="62" y="92">FIELD</text><text class="small" x="62" y="116">RFID · devices</text><text class="small" x="62" y="135">real operations</text></g>
  <g><rect class="box" x="265" y="60" width="155" height="90" rx="12"/><text class="label" x="291" y="92">PRODUCT</text><text class="small" x="291" y="116">web · mobile</text><text class="small" x="291" y="135">desktop apps</text></g>
  <g><rect class="box" x="505" y="60" width="155" height="90" rx="12"/><text class="label" x="531" y="92">SERVICES</text><text class="small" x="531" y="116">APIs · events</text><text class="small" x="531" y="135">integrations</text></g>
  <g><rect class="box" x="745" y="60" width="155" height="90" rx="12"/><text class="label" x="771" y="92">PLATFORM</text><text class="small" x="771" y="116">Linux · Docker</text><text class="small" x="771" y="135">CI/CD · observability</text></g>
  <g><rect class="box" x="990" y="60" width="75" height="90" rx="12"/><text class="label" x="1004" y="92">AI</text><text class="small" x="1004" y="116">assist</text><text class="small" x="1004" y="135">automate</text></g>
  <text x="35" y="35" fill="#64748b" font-family="monospace" font-size="12">FROM SIGNAL TO SOFTWARE</text>
</svg>
