name: Update profile assets

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Generate real profile data
        env:
          PROFILE_GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
        run: python3 scripts/generate_profile.py

      - name: Commit refreshed assets
        run: |
          printf 'Last refresh: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > assets/last-refresh.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets data scripts
          git diff --cached --quiet || git commit -m 'chore: refresh profile metrics'
          git push
