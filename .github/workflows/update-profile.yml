name: Update profile assets

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Keep the profile alive
        run: |
          printf 'Last refresh: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > assets/last-refresh.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/last-refresh.txt
          git diff --cached --quiet || git commit -m 'chore: refresh profile assets'
          git push
